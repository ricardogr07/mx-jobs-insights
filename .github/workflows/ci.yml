name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project dependencies
        id: install
        run: python -m pip install -e ".[dev]"

      - name: Install build tools
        id: install_build
        # --no-isolation skips installing build-system.requires, so setuptools
        # has to be here: python 3.12 dropped the bundled copy 3.11 provided.
        run: python -m pip install wheel build setuptools

      - name: Run Ruff
        id: ruff
        run: python -m ruff check src tests

      - name: Run Pytest
        id: pytest
        run: python -m pytest -q --basetemp .pytest_tmp

      - name: Build docs strictly
        id: mkdocs
        env:
          MX_JOBS_OPENAI_BASE_URL: mock://responses
          OPENAI_API_KEY: ci-mock
          MX_JOBS_OPENAI_MODEL: ci-mock
          MX_JOBS_PUBLIC_KEY_SALT: ci-mock
        run: |
          # docs/ public pages are generated, not committed. Build them from the
          # fixture with a mock model, then validate the strict MkDocs build.
          python -m mexico_linkedin_jobs_portfolio pipeline \
            --cadence weekly --source auto \
            --upstream-root tests/data/upstream_workspace \
            --curated-root artifacts/ci/curated \
            --report-root artifacts/ci/reports \
            --docs-root docs \
            --narrative-cache-root artifacts/ci/narratives \
            --locale all --as-of 2026-04-01 --filter-by-posted-date
          python -m mkdocs build --strict

      - name: Build package
        id: build
        run: python -m build --no-isolation

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "# CI summary (Python ${{ matrix.python-version }})"
            echo
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Python: \`${{ matrix.python-version }}\`"
            echo "- Ref: \`${{ github.ref_name }}\`"
            echo "- Ruff: \`${{ steps.ruff.outcome }}\`"
            echo "- Pytest: \`${{ steps.pytest.outcome }}\`"
            echo "- MkDocs strict build: \`${{ steps.mkdocs.outcome }}\`"
            echo "- Package build: \`${{ steps.build.outcome }}\`"
            echo "- Public site: [mx-jobs-insights](${PAGES_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
